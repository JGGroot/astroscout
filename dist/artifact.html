<style>
:root{
  --bg:#07080c; --panel:rgba(14,16,22,.92); --panel-solid:#0e1016;
  --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.20);
  --fg:#e8eaf0; --dim:#9aa1b2; --dim2:#6b7285;
  --accent:#ffb454; --accent2:#5fa8ff; --core:#ff8c42; --moon:#cfd6e6;
  --ok:#5ddb8b; --bad:#ff6b6b;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0}
#gl,#hud{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{pointer-events:none}

/* ---- top bar ---- */
#top{position:absolute;top:0;left:0;right:0;padding:calc(var(--safe-t) + 8px) 10px 8px;
  display:flex;gap:8px;align-items:center;z-index:5;
  background:linear-gradient(180deg,rgba(4,5,8,.94) 30%,rgba(4,5,8,.55) 72%,rgba(4,5,8,0))}
#top .place{flex:1;min-width:0}
#top .place b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .place span{display:block;color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
.iconbtn{width:38px;height:38px;flex:0 0 38px;border-radius:11px;border:1px solid var(--line);
  background:rgba(20,23,32,.72);color:var(--fg);display:grid;place-items:center;font-size:16px;
  backdrop-filter:blur(12px);cursor:pointer;pointer-events:auto}
.iconbtn:active{background:rgba(50,56,72,.9)}
.iconbtn.on{border-color:var(--accent);color:var(--accent)}

/* ---- readout chips ---- */
#chips{position:absolute;left:10px;right:10px;top:calc(var(--safe-t) + 56px);z-index:4;
  display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.chip{background:rgba(16,19,27,.78);border:1px solid var(--line);border-radius:9px;
  padding:4px 8px;font-size:11px;color:var(--dim);backdrop-filter:blur(10px);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{color:var(--fg);font-weight:600}
.chip.core b{color:var(--core)} .chip.moon b{color:var(--moon)} .chip.warn b{color:var(--bad)}
.chip.good b{color:var(--ok)}

/* ---- bottom dock ---- */
#dock{position:absolute;left:0;right:0;bottom:0;z-index:6;
  background:linear-gradient(0deg,rgba(4,5,8,.94) 62%,rgba(4,5,8,0));
  padding-bottom:var(--safe-b)}
#timeline{width:100%;height:84px;display:block;touch-action:none}
#timerow{display:flex;align-items:center;gap:8px;padding:2px 10px 8px}
#timerow .now{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.3px}
#timerow .date{color:var(--dim);font-size:11px}
#timerow .grow{flex:1}
.tabbar{display:flex;gap:6px;padding:0 10px 10px;overflow-x:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  background:rgba(20,23,32,.7);color:var(--dim);font-size:12px;cursor:pointer}
.tab.on{background:var(--fg);color:#0a0c11;border-color:var(--fg);font-weight:600}

/* ---- sheet ---- */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;max-height:82%;
  background:var(--panel);backdrop-filter:blur(22px);border-top:1px solid var(--line-strong);
  border-radius:18px 18px 0 0;transform:translateY(110%);transition:transform .26s cubic-bezier(.3,.8,.3,1);
  display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
#sheet.open{transform:translateY(0)}
#sheet header{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;flex:0 0 auto}
#sheet header h2{margin:0;font-size:15px;font-weight:600;flex:1}
#sheet .body{overflow-y:auto;padding:0 14px 18px;-webkit-overflow-scrolling:touch}
.grabber{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:36px;height:4px;
  border-radius:2px;background:var(--line-strong)}

/* ---- form bits ---- */
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row label{flex:0 0 40%;color:var(--dim);font-size:12px}
.row .val{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--fg)}
input,select,button,textarea{font:inherit;color:var(--fg)}
input[type=text],input[type=number],input[type=date],input[type=search],select{
  background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:9px;
  padding:8px 10px;width:100%;min-width:0}
input[type=range]{width:100%;accent-color:var(--accent);background:transparent}
.btn{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;cursor:pointer;font-size:12px;white-space:nowrap}
.btn:active{background:rgba(255,255,255,.16)}
.btn.primary{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:600}
.btn.wide{width:100%;text-align:center}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pill{padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);
  text-align:center;font-size:12px;cursor:pointer}
.pill.on{border-color:var(--accent);background:rgba(255,180,84,.16);color:var(--accent)}
.switch{margin-left:auto;width:42px;height:25px;border-radius:13px;background:rgba(255,255,255,.14);
  position:relative;cursor:pointer;flex:0 0 42px;transition:background .15s}
.switch::after{content:'';position:absolute;top:2.5px;left:2.5px;width:20px;height:20px;border-radius:50%;
  background:#fff;transition:transform .15s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(17px)}
h3.sec{margin:16px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim2)}
.hint{color:var(--dim2);font-size:11px;line-height:1.5;margin:6px 0}
.list{margin:0;padding:0;list-style:none}
.list li{padding:9px 4px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;cursor:pointer}
.list li:active{background:rgba(255,255,255,.05)}
.list li .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list li .m{color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums;text-align:right}
table.kv{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.kv td{padding:6px 2px;border-bottom:1px solid var(--line);font-size:12px}
table.kv td:first-child{color:var(--dim)}
table.kv td:last-child{text-align:right}
.badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:600;
  background:rgba(255,255,255,.1);color:var(--dim)}
.badge.ok{background:rgba(93,219,139,.18);color:var(--ok)}
.badge.bad{background:rgba(255,107,107,.16);color:var(--bad)}
.badge.warn{background:rgba(255,180,84,.18);color:var(--accent)}

/* ---- toast / progress ---- */
#scoutbar[hidden]{display:none}
#scoutbar{position:absolute;left:10px;right:10px;bottom:calc(var(--safe-b) + 196px);z-index:8;
  display:flex;gap:8px;align-items:center;background:rgba(14,16,22,.9);backdrop-filter:blur(14px);
  border:1px solid var(--line-strong);border-radius:13px;padding:9px 11px}
#scoutbar .info{flex:1;min-width:0}
#scoutbar .info b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scoutbar .info span{display:block;color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
#scoutbar .btn[disabled]{opacity:.4}
#scoutbar .btn#scoutStand:not([disabled]){background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:600}
@media (min-width:820px){#scoutbar{left:auto;right:12px;width:400px;bottom:calc(var(--safe-b) + 210px)}}

#toast{position:absolute;left:50%;bottom:calc(var(--safe-b) + 200px);transform:translateX(-50%);
  background:rgba(16,19,27,.94);border:1px solid var(--line-strong);border-radius:11px;
  padding:9px 14px;font-size:12px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;
  max-width:82%;text-align:center;backdrop-filter:blur(10px)}
#toast.show{opacity:1}
#prog{position:absolute;top:0;left:0;height:2px;background:var(--accent);width:0;z-index:50;transition:width .2s}
#splash{position:fixed;inset:0;background:var(--bg);z-index:100;display:grid;place-items:center;
  text-align:center;transition:opacity .4s}
#splash.gone{opacity:0;pointer-events:none}
#splash .t{font-size:22px;font-weight:600;letter-spacing:.4px}
#splash .s{color:var(--dim);font-size:12px;margin-top:8px;max-width:280px}
@media (min-width:820px){
  #sheet{left:auto;right:12px;bottom:12px;width:400px;max-height:calc(100% - 120px);
    border-radius:16px;border:1px solid var(--line-strong)}
  #sheet.open{transform:translateY(0)}
  #timeline{height:96px}
}

 * 160 km far plane.
 */

const V_SKY = `#version 300 es
in vec2 aPos;
out vec2 vNdc;
void main(){ vNdc = aPos; gl_Position = vec4(aPos, 0.0, 1.0); }`;

const F_SKY = `#version 300 es
precision highp float;
in vec2 vNdc;
out vec4 fragColor;

uniform vec3 uRight, uUp, uFwd;
uniform vec2 uTan;              // tan(hfov/2), tan(vfov/2)
uniform mat3 uGal;              // render space -> galactic cartesian
uniform vec3 uSunDir, uMoonDir; // render space, unit
uniform float uSunAlt, uMoonAlt, uMoonIllum;
uniform float uMwGain, uLightPol, uExposure;
uniform vec3 uLpColor;

float hash(vec3 p){ p = fract(p*0.3183099+vec3(0.1,0.2,0.3)); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float noise(vec3 x){
  vec3 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(hash(i+vec3(0,0,0)),hash(i+vec3(1,0,0)),f.x),
                 mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),
                 mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);
}
float fbm(vec3 p){ float a=0.5,s=0.0; for(int i=0;i<5;i++){ s+=a*noise(p); p*=2.03; a*=0.5;} return s; }

// Procedural Milky Way. Positionally exact (driven by galactic coordinates);
// the brightness profile is a model of the real isophotes: a Sagittarius bulge,
// a disk that thins toward the anticentre, the Great Rift, and the Cygnus and
// Scutum star clouds.
float milkyway(vec3 d){
  vec3 g = normalize(uGal * d);
  float b = degrees(asin(clamp(g.z,-1.0,1.0)));
  float l = degrees(atan(g.y, g.x));            // -180..180
  float al = abs(l);
  float bulge = exp(-0.5*(pow(l/15.0,2.0) + pow(b/10.5,2.0)));
  float w = mix(3.4, 7.0, smoothstep(0.0, 180.0, al));
  float disk = exp(-0.5*pow(b/w,2.0)) * (0.30 + 0.70*exp(-al/62.0));
  float cyg  = 0.60*exp(-0.5*(pow((l-80.0)/13.0,2.0)+pow((b-0.5)/4.5,2.0)));
  float sct  = 0.45*exp(-0.5*(pow((l-27.0)/9.0,2.0)+pow((b-0.5)/3.6,2.0)));
  float car  = 0.40*exp(-0.5*(pow((l+72.0)/14.0,2.0)+pow(b/4.0,2.0)));
  float base = 1.25*bulge + disk + cyg + sct + car;
  // Great Rift: dust from Cygnus down through Aquila to Sagittarius
  float rift = 0.66*exp(-0.5*pow((b-1.1)/2.7,2.0))
             * smoothstep(-18.0,6.0,l) * (1.0-smoothstep(40.0,86.0,l));
  // Coalsack / Ophiuchus dark clouds
  float dark = 0.35*exp(-0.5*(pow((l+57.0)/7.0,2.0)+pow((b+1.0)/3.0,2.0)))
             + 0.30*exp(-0.5*(pow((l-1.0)/7.0,2.0)+pow((b-11.0)/5.0,2.0)));
  float mott = 0.62 + 0.75*fbm(g*22.0) - 0.25*fbm(g*7.0);
  return max(0.0, base*(1.0-rift)*(1.0-dark)*mott);
}

vec3 skyColor(vec3 d, float alt){
  float sunAngle = degrees(acos(clamp(dot(d,uSunDir),-1.0,1.0)));
  float h = clamp(alt/90.0, -1.0, 1.0);
  // day / twilight / night blend driven by the true solar altitude
  float day   = smoothstep(-6.0, 4.0, uSunAlt);
  float civil = smoothstep(-13.0, -1.0, uSunAlt);
  float astro = smoothstep(-19.0, -8.0, uSunAlt);

  vec3 night  = mix(vec3(0.016,0.024,0.045), vec3(0.007,0.010,0.022), h);
  vec3 deep   = mix(vec3(0.06,0.11,0.22), vec3(0.015,0.035,0.09), h);
  vec3 blue   = mix(vec3(0.30,0.46,0.72), vec3(0.10,0.24,0.62), h);
  vec3 dayc   = mix(vec3(0.62,0.74,0.92), vec3(0.24,0.44,0.86), h);
  vec3 c = mix(night, deep, astro);
  c = mix(c, blue, civil);
  c = mix(c, dayc, day);

  // warm glow toward the sun while it is near the horizon
  float glow = exp(-sunAngle/26.0) * smoothstep(-14.0, 2.0, uSunAlt) * (1.0 - 0.55*day);
  c += vec3(0.85,0.42,0.14) * glow * 1.25;
  float belt = exp(-pow((alt-3.0)/10.0,2.0)) * exp(-sunAngle/70.0)
             * smoothstep(-10.0,0.0,uSunAlt)*(1.0-day);
  c += vec3(0.35,0.13,0.16)*belt;

  // light pollution: a dome that hugs the horizon
  float lp = uLightPol * exp(-max(alt,0.0)/18.0) * (1.0-day);
  c += uLpColor * lp;
  // airglow
  c += vec3(0.010,0.020,0.014) * exp(-max(alt,0.0)/22.0) * (1.0-civil);

  // moonlight wash
  float moonAngle = degrees(acos(clamp(dot(d,uMoonDir),-1.0,1.0)));
  float moonUp = smoothstep(-4.0, 8.0, uMoonAlt);
  float ml = uMoonIllum * moonUp * (1.0-day);
  c += vec3(0.16,0.19,0.28) * ml * (0.22 + 1.5*exp(-moonAngle/24.0)) * (0.35+0.65*exp(-max(alt,0.0)/40.0));

  // Milky Way, suppressed as the sky brightens
  float mwVis = (1.0-civil) * (1.0 - 0.85*clamp(ml*1.6,0.0,1.0)) * (1.0 - 0.6*clamp(lp*3.0,0.0,1.0));
  float mw = milkyway(d) * uMwGain * mwVis;
  c += vec3(0.62,0.63,0.72) * mw * 0.055 + vec3(0.30,0.26,0.22) * mw*mw * 0.012;

  // extinction toward the horizon
  c *= mix(1.0, 0.72, smoothstep(12.0, -2.0, alt));
  return c;
}

void main(){
  vec3 d = normalize(uFwd + uRight*vNdc.x*uTan.x + uUp*vNdc.y*uTan.y);
  float alt = degrees(asin(clamp(d.y,-1.0,1.0)));
  vec3 c = skyColor(d, alt);
  // below the horizon, fade to a neutral ground tone (terrain draws over it)
  c = mix(c, c*0.25 + vec3(0.02,0.02,0.025), smoothstep(0.0,-6.0,alt));
  c *= uExposure;
  fragColor = vec4(pow(max(c,0.0), vec3(1.0/2.2)), 1.0);
}`;

const V_STAR = `#version 300 es
in vec3 aDir;        // J2000 unit vector
in vec2 aMagBV;      // magnitude, B-V
in vec3 aColor;
out vec3 vColor;
out float vAlpha;
uniform mat3 uSky;   // J2000 -> render
uniform vec3 uRight, uUp, uFwd;
uniform vec2 uTan;
uniform float uPixScale, uSkyBright, uStarGain, uMagLimit;
void main(){
  vec3 d = uSky * aDir;
  float x = dot(d, uRight), y = dot(d, uUp), z = dot(d, uFwd);
  if (z <= 0.02) { gl_Position = vec4(2.0,2.0,2.0,1.0); gl_PointSize = 0.0; vAlpha = 0.0; return; }
  gl_Position = vec4(x/(z*uTan.x), y/(z*uTan.y), 0.0, 1.0);
  float mag = aMagBV.x;
  float alt = degrees(asin(clamp(d.y,-1.0,1.0)));
  // atmospheric extinction: about 0.25 mag at the zenith, rising near the horizon
  float airmass = 1.0/max(0.09, sin(radians(max(alt, 1.5))));
  float m = mag + 0.23*airmass;
  float bright = pow(2.512, (uMagLimit - m)) * uStarGain;
  bright *= smoothstep(-1.5, 2.0, alt);
  bright /= (1.0 + uSkyBright*9.0);
  float size = uPixScale * (0.85 + 1.45*log(1.0+bright));
  gl_PointSize = clamp(size, 0.0, 46.0);
  vAlpha = clamp(bright*0.55, 0.0, 1.0);
  vColor = aColor;
}`;

const F_STAR = `#version 300 es
precision highp float;
in vec3 vColor; in float vAlpha;
out vec4 fragColor;
void main(){
  vec2 p = gl_PointCoord*2.0-1.0;
  float r = length(p);
  if (r > 1.0) discard;
  float core = exp(-r*r*7.0);
  float halo = exp(-r*2.6)*0.22;
  float a = (core+halo)*vAlpha;
  fragColor = vec4(vColor*a, a);
}`;

const V_LINE = `#version 300 es
in vec3 aDir;
uniform mat3 uSky;
uniform vec3 uRight, uUp, uFwd;
uniform vec2 uTan;
out float vClip;
void main(){
  vec3 d = uSky * aDir;
  float z = dot(d, uFwd);
  vClip = z;
  if (z <= 0.02){ gl_Position = vec4(2.0,2.0,2.0,1.0); return; }
  gl_Position = vec4(dot(d,uRight)/(z*uTan.x), dot(d,uUp)/(z*uTan.y), 0.0, 1.0);
}`;

const F_LINE = `#version 300 es
precision highp float;
in float vClip;
uniform vec4 uColor;
out vec4 fragColor;
void main(){ if (vClip <= 0.02) discard; fragColor = vec4(uColor.rgb*uColor.a, uColor.a); }`;

const V_BODY = `#version 300 es
in vec3 aDir; in vec4 aParam;    // radius px, kind, illum, limb angle
in vec3 aColor;
out vec3 vColor; out vec4 vParam;
uniform vec3 uRight, uUp, uFwd;
uniform vec2 uTan;
void main(){
  float z = dot(aDir, uFwd);
  if (z <= 0.02){ gl_Position = vec4(2.0,2.0,2.0,1.0); gl_PointSize=0.0; vParam=vec4(0.0); return; }
  gl_Position = vec4(dot(aDir,uRight)/(z*uTan.x), dot(aDir,uUp)/(z*uTan.y), 0.0, 1.0);
  gl_PointSize = clamp(aParam.x, 2.0, 300.0);
  vColor = aColor; vParam = aParam;
}`;

const F_BODY = `#version 300 es
precision highp float;
in vec3 vColor; in vec4 vParam;
out vec4 fragColor;
void main(){
  vec2 p = gl_PointCoord*2.0-1.0;
  float r = length(p);
  float kind = vParam.y;
  if (kind < 0.5) {                       // sun / planet: disc plus bloom
    if (r > 1.0) discard;
    float disc = smoothstep(0.62, 0.42, r);
    float bloom = exp(-r*r*4.0)*0.5 + exp(-r*3.0)*0.25;
    float a = clamp(disc + bloom, 0.0, 1.0);
    fragColor = vec4(vColor*a, a);
  } else {                                 // moon: real phase
    if (r > 1.0) discard;
    float k = vParam.z, ang = vParam.w;
    float c = cos(ang), s = sin(ang);
    vec2 q = vec2(p.x*c - p.y*s, p.x*s + p.y*c);   // bright limb toward +x
    float edge = 0.66;
    float lit = 1.0;
    if (r <= edge) {
      vec2 u = q/edge;
      float term = (1.0 - 2.0*k) * sqrt(max(0.0, 1.0 - u.y*u.y));
      lit = smoothstep(term-0.035, term+0.035, u.x);
      vec3 surf = mix(vec3(0.10,0.11,0.14), vColor, lit*0.97+0.03);
      float a = smoothstep(edge+0.02, edge-0.02, r);
      float halo = exp(-max(0.0,r-edge)*3.5)*0.30*k;
      fragColor = vec4(surf*a + vColor*halo, clamp(a+halo,0.0,1.0));
    } else {
      float halo = exp(-(r-edge)*4.0)*0.34*k;
      fragColor = vec4(vColor*halo, halo);
    }
  }
}`;

const V_WLINE = `#version 300 es
in vec3 aPos;
uniform mat4 uProj, uView;
void main(){ gl_Position = uProj * uView * vec4(aPos, 1.0); }`;

const F_WLINE = `#version 300 es
precision highp float;
uniform vec4 uColor;
out vec4 fragColor;
void main(){ fragColor = vec4(uColor.rgb*uColor.a, uColor.a); }`;

const V_TERRAIN = `#version 300 es
in vec3 aPos; in vec3 aNrm; in vec2 aGeo; in float aElev;
out vec3 vNrm; out vec3 vPos; out vec2 vGeo; out float vElev; out float vDist;
uniform mat4 uProj; uniform mat4 uView; uniform vec3 uCamPos;
void main(){
  vNrm = aNrm; vPos = aPos; vGeo = aGeo; vElev = aElev;
  vDist = length(aPos - uCamPos);
  gl_Position = uProj * uView * vec4(aPos, 1.0);
}`;

const F_TERRAIN = `#version 300 es
precision highp float;
in vec3 vNrm; in vec3 vPos; in vec2 vGeo; in float vElev; in float vDist;
out vec4 fragColor;
uniform vec3 uSunDir, uMoonDir, uLpColor;
uniform float uSunAlt, uMoonAlt, uMoonIllum, uExposure, uHaze, uBoost, uLightPol;
uniform sampler2D uImgA, uImgB;          // wide drape, sharp inner drape
uniform vec2 uImgAOrigin, uImgBOrigin;   // composite origin, tile units
uniform vec2 uImgAP, uImgBP;             // (tiles across, 2^zoom)
uniform float uUseImgA, uUseImgB;
uniform float uScoutLight;               // artificial relief light for scouting
uniform float uSnowLine, uTreeLine, uBaseElev;

vec4 drape(sampler2D tex, vec2 origin, vec2 p, vec2 geo){
  float tx = (geo.x + 180.0) / 360.0 * p.y;
  float sy = sin(radians(clamp(geo.y, -85.05, 85.05)));
  float ty = (0.5 - log((1.0+sy)/(1.0-sy)) / (4.0*3.14159265)) * p.y;
  vec2 uv = (vec2(tx, ty) - origin) / p.x;
  if (uv.x <= 0.0 || uv.x >= 1.0 || uv.y <= 0.0 || uv.y >= 1.0) return vec4(0.0);
  float fade = 1.0 - smoothstep(0.35, 0.495, max(abs(uv.x-0.5), abs(uv.y-0.5)));
  return vec4(texture(tex, uv).rgb, fade);
}

vec3 hypsometric(float h, float slope){
  vec3 low  = vec3(0.16,0.19,0.13);
  vec3 mid  = vec3(0.28,0.26,0.18);
  vec3 high = vec3(0.34,0.31,0.28);
  vec3 rock = vec3(0.30,0.28,0.27);
  vec3 snow = vec3(0.86,0.88,0.92);
  float t1 = smoothstep(0.0, uTreeLine, h);
  float t2 = smoothstep(uTreeLine, uSnowLine, h);
  float t3 = smoothstep(uSnowLine, uSnowLine+420.0, h);
  vec3 c = mix(low, mid, t1);
  c = mix(c, high, t2);
  c = mix(c, snow, t3*(1.0 - smoothstep(0.55,0.85,slope)));
  c = mix(c, rock, smoothstep(0.5,0.85,slope)*0.8);
  return c;
}

void main(){
  vec3 n = normalize(vNrm);
  float slope = 1.0 - clamp(n.y, 0.0, 1.0);
  vec3 albedo = hypsometric(vElev, slope);
  if (uUseImgA > 0.5) { vec4 a = drape(uImgA, uImgAOrigin, uImgAP, vGeo); albedo = mix(albedo, a.rgb*1.05, a.a); }
  if (uUseImgB > 0.5) { vec4 b = drape(uImgB, uImgBOrigin, uImgBP, vGeo); albedo = mix(albedo, b.rgb*1.05, b.a); }

  float sunUp = smoothstep(-6.0, 1.0, uSunAlt);
  vec3 sunCol = mix(vec3(1.0,0.45,0.18), vec3(1.0,0.97,0.92), smoothstep(-1.0, 12.0, uSunAlt));
  float sunLam = max(0.0, dot(n, uSunDir));
  vec3 lit = sunCol * sunLam * sunUp * 1.35;

  float moonUp = smoothstep(-3.0, 6.0, uMoonAlt);
  float moonLam = max(0.0, dot(n, uMoonDir));
  lit += vec3(0.42,0.48,0.66) * moonLam * moonUp * uMoonIllum * 0.30;

  // ambient from the sky dome
  float day = smoothstep(-8.0, 2.0, uSunAlt);
  vec3 ambient = mix(vec3(0.012,0.016,0.030), vec3(0.30,0.36,0.48), day);
  ambient += uLpColor * uLightPol * 0.35 * (1.0-day);
  ambient += vec3(0.05,0.06,0.09) * uMoonIllum * moonUp * 0.5;
  ambient *= (0.45 + 0.55*clamp(n.y,0.0,1.0));

  // scouting light: a fixed north-west key so the landscape reads in the dark.
  // Never used for the eye-level planning view.
  vec3 scoutDir = normalize(vec3(-0.55, 0.62, -0.55));
  float sc = max(0.0, dot(n, scoutDir));
  lit += vec3(1.0, 0.98, 0.94) * (0.25 + 0.85*sc) * uScoutLight;

  vec3 c = albedo * (lit + ambient);
  c += albedo * uBoost * (0.35 + 0.65*clamp(n.y,0.0,1.0));

  // distance haze toward the sky colour near the horizon
  float hz = 1.0 - exp(-vDist / max(2000.0, uHaze));
  vec3 hazeCol = mix(vec3(0.020,0.028,0.050), vec3(0.55,0.66,0.85), day);
  hazeCol += uLpColor * uLightPol * 0.6 * (1.0-day);
  hazeCol += vec3(0.10,0.12,0.17) * uMoonIllum * moonUp;
  c = mix(c, hazeCol, hz*0.92);

  c *= uExposure;
  fragColor = vec4(pow(max(c,0.0), vec3(1.0/2.2)), 1.0);
}`;

/* ---------- helpers ---------- */
function compile(gl, type, src, label) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(`${label} shader: ${gl.getShaderInfoLog(s)}`);
  return s;
}
function program(gl, vs, fs, label) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, vs, label + ' vert'));
  gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fs, label + ' frag'));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    throw new Error(`${label} link: ${gl.getProgramInfoLog(p)}`);
  const u = {}, a = {};
  const nu = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < nu; i++) { const n = gl.getActiveUniform(p, i).name.replace('[0]', ''); u[n] = gl.getUniformLocation(p, n); }
  const na = gl.getProgramParameter(p, gl.ACTIVE_ATTRIBUTES);
  for (let i = 0; i < na; i++) { const n = gl.getActiveAttrib(p, i).name; a[n] = gl.getAttribLocation(p, n); }
  return { p, u, a };
}
function buf(gl, data, target = gl.ARRAY_BUFFER, usage = gl.STATIC_DRAW) {
  const b = gl.createBuffer(); gl.bindBuffer(target, b); gl.bufferData(target, data, usage); return b;
}

class Renderer {
  constructor(canvas) {
    const gl = canvas.getContext('webgl2', {
      antialias: true, alpha: false, depth: true, stencil: false,
      powerPreference: 'high-performance', preserveDrawingBuffer: true
    });
    if (!gl) throw new Error('WebGL2 is not available in this browser.');
    this.gl = gl; this.canvas = canvas;
    this.progSky = program(gl, V_SKY, F_SKY, 'sky');
    this.progStar = program(gl, V_STAR, F_STAR, 'star');
    this.progLine = program(gl, V_LINE, F_LINE, 'line');
    this.progBody = program(gl, V_BODY, F_BODY, 'body');
    this.progTer = program(gl, V_TERRAIN, F_TERRAIN, 'terrain');
    this.progWLine = program(gl, V_WLINE, F_WLINE, 'world line');
    this.quad = buf(gl, new Float32Array([-1, -1, 3, -1, -1, 3]));
    this.vaoSky = gl.createVertexArray();
    gl.bindVertexArray(this.vaoSky);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.quad);
    gl.enableVertexAttribArray(this.progSky.a.aPos);
    gl.vertexAttribPointer(this.progSky.a.aPos, 2, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);
    this.lines = new Map();
    this.worldLines = new Map();
    this.terrain = null; this.stars = null; this.imagery = null; this.imageryB = null;
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
  }

  resize(w, h, dpr) {
    const c = this.canvas;
    const W = Math.max(1, Math.round(w * dpr)), H = Math.max(1, Math.round(h * dpr));
    if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
    this.gl.viewport(0, 0, W, H);
    this.dpr = dpr; this.w = W; this.h = H;
  }

  /** stars: array of [ra,dec,mag,bv,name]; colorFn(bv)->[r,g,b] */
  setStars(list, colorFn, raDecToVec) {
    const gl = this.gl, n = list.length;
    const dir = new Float32Array(n * 3), mb = new Float32Array(n * 2), col = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const s = list[i], v = raDecToVec(s[0], s[1]);
      dir[i * 3] = v[0]; dir[i * 3 + 1] = v[1]; dir[i * 3 + 2] = v[2];
      mb[i * 2] = s[2]; mb[i * 2 + 1] = s[3];
      const c = colorFn(s[3]);
      col[i * 3] = c[0]; col[i * 3 + 1] = c[1]; col[i * 3 + 2] = c[2];
    }
    const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    const P = this.progStar.a;
    const bind = (data, loc, size) => {
      gl.bindBuffer(gl.ARRAY_BUFFER, buf(gl, data));
      gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
    };
    bind(dir, P.aDir, 3); bind(mb, P.aMagBV, 2); bind(col, P.aColor, 3);
    gl.bindVertexArray(null);
    this.stars = { vao, count: n };
  }

  /** Named line set. space: 'sky' (J2000 unit vectors) or 'local' (render space). */
  setLines(name, dirs, { color = [1, 1, 1, 0.3], space = 'sky', mode = 'LINES' } = {}) {
    const gl = this.gl;
    if (!dirs || !dirs.length) { this.lines.delete(name); return; }
    const arr = dirs instanceof Float32Array ? dirs : new Float32Array(dirs);
    const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, buf(gl, arr));
    gl.enableVertexAttribArray(this.progLine.a.aDir);
    gl.vertexAttribPointer(this.progLine.a.aDir, 3, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);
    const old = this.lines.get(name);
    if (old) gl.deleteVertexArray(old.vao);
    this.lines.set(name, { vao, count: arr.length / 3, color, space, mode });

  /* ---------- timeline ---------- */
  drawTimeline() {
    const app = this.app, S = app.S, s = app.night;
    const c = this.tl, x = this.tlx;
    const dpr = Math.min(2.5, devicePixelRatio || 1);
    const W = c.clientWidth, H = c.clientHeight;
    if (c.width !== W * dpr || c.height !== H * dpr) { c.width = W * dpr; c.height = H * dpr; }
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.clearRect(0, 0, W, H);
    if (!s) return;
    const t0 = s.t[0], t1 = s.t[s.n - 1], span = t1 - t0;
    const px = j => (j - t0) / span * W;
    const top = 6, bot = H - 16, hgt = bot - top;
    const ay = a => bot - Math.max(-18, Math.min(70, a)) / 88 * hgt - 18 / 88 * hgt;

    // twilight bands
    for (let i = 0; i < s.n - 1; i++) {
      const a = s.sunAlt[i];
      let col;
      if (a > 0) col = '#2a4a7a';
      else if (a > -6) col = '#24365c';
      else if (a > -12) col = '#182444';
      else if (a > -18) col = '#0f1830';
      else col = '#070c18';
      x.fillStyle = col;
      x.fillRect(px(s.t[i]), 0, W / (s.n - 1) + 1, H);
    }
    // shootable windows
    const wins = P.shootWindows(s, app.constraints());
    for (const w of wins) {
      const g = x.createLinearGradient(0, top, 0, bot);
      g.addColorStop(0, 'rgba(255,140,66,.30)'); g.addColorStop(1, 'rgba(255,140,66,.06)');
      x.fillStyle = g; x.fillRect(px(w.from), 0, px(w.to) - px(w.from), H);
      x.fillStyle = 'rgba(255,140,66,.9)'; x.fillRect(px(w.from), 0, 1.5, H);
      x.fillRect(px(w.to) - 1.5, 0, 1.5, H);
    }
    // horizon line
    x.strokeStyle = 'rgba(255,255,255,.22)'; x.lineWidth = 1;
    x.beginPath(); x.moveTo(0, ay(0)); x.lineTo(W, ay(0)); x.stroke();

    const curve = (arr, col, w, dash) => {
      x.strokeStyle = col; x.lineWidth = w; x.setLineDash(dash || []);
      x.beginPath();
      for (let i = 0; i < s.n; i++) { const X = px(s.t[i]), Y = ay(arr[i]); i ? x.lineTo(X, Y) : x.moveTo(X, Y); }
      x.stroke(); x.setLineDash([]);

        out.push({ dir: p.dir, text: p.name, color: 'rgba(255,220,180,.75)' });
    const M = A.mat3apply.bind(null, A.skyMatrix(S.lat, A.lstDeg(this.jd, S.lon), A.century(A.jdeFromJD(this.jd))));
    const starLabels = this.skyBright < 0.55;
    for (const s of BRIGHT_STARS) {
      if (s[2] > 1.65 || !starLabels) continue;
      const d = M(A.raDecToVec(s[0], s[1]));
      if (d[1] < -0.02) continue;
      out.push({ dir: d, text: s[4], color: 'rgba(210,225,255,.62)' });
    }
    this.labels = out;
  }

  /* ---------- terrain ---------- */
  async loadTerrain() {
    const S = this.S;
    if (this._loading) return;
    this._loading = true;
    this.ui.toast('Fetching elevation tiles…', 9000);
    try {
      const plan = tilePlan(S.quality);
      // try the chosen source, then the other keyless hosts, before giving up
      const order = [S.demSource, 'terrarium', 'terrariumAlt']
        .filter((v, i, a) => a.indexOf(v) === i && DEM_SOURCES[v])
        .filter(k => !DEM_SOURCES[k].needsKey || S.demKey);
      let dem = null;
      for (const key of order) {
        const d = new DemPyramid();
        d.src = DEM_SOURCES[key]; d.key = S.demKey;
        await d.load(S.lat, S.lon, plan, { onProgress: (a, b) => this.ui.progress(a / b) });
        if (d.levels.some(l => l.tiles.size)) {
          dem = d;
          if (key !== S.demSource) {
            S.demSource = key;
            this.ui.toast(`Switched to ${DEM_SOURCES[key].name} — the previous source did not respond`, 4500);
          }
          break;
        }
        this.ui.toast(`${DEM_SOURCES[key].name} returned nothing, trying the next source…`, 3000);
      }
      this.ui.progress(0);
      if (!dem) {
        const dummy = { levels: [] };
        dem = dummy;
      }
      if (!dem.levels.some(l => l.tiles.size)) {
        this.ui.toast(window.__ASTROSCOUT_PREVIEW
          ? 'This hosted preview is sandboxed and cannot fetch map tiles. Everything else — sky, timeline, planner — works here; run the deployed build for terrain.'
          : 'No elevation tiles could be fetched. Check the connection, or pick another source under Sky & terrain.', 7000);
        this._loading = false; return;
      }
      const azSteps = { fast: 512, balanced: 768, max: 1024 }[S.quality];
      const rMax = { fast: 100000, balanced: 160000, max: 240000 }[S.quality];
      S.rMax = rMax;
      const mesh = buildMesh(dem, S.lat, S.lon, {
        azSteps, rMax, eyeHeight: S.eyeHeight,
        drMax: S.quality === 'max' ? 700 : 900
      });
      this.dem = dem; this.mesh = mesh;
      this.renderer.setTerrain(mesh);
      let tiles = 0; dem.levels.forEach(l => tiles += l.tiles.size);
      S.terrainLoaded = true; S.autoTerrain = true;
      S.terrainInfo = `${tiles} tiles · ${(mesh.nVerts / 1000) | 0}k vertices · ${(rMax / 1000)} km radius · ground ${mesh.baseElev.toFixed(0)} m`;
      this.save();
      // snow/tree lines follow the local terrain so shading looks plausible anywhere
      const e = mesh.baseElev;
      this.snowLine = Math.max(600, e + 1400 - Math.abs(S.lat) * 22);
      this.treeLine = Math.max(200, this.snowLine - 900);
      this.recomputeNight();
      this.ui.toast(`Terrain loaded — ${tiles} tiles, horizon at ${(rMax / 1000)} km`, 3000);
      if (S.useImagery) this.loadImagery();
    } catch (e) {
      this.ui.toast('Terrain failed: ' + e.message, 5000);
    }
    this._loading = false;
    this.invalidate();
  }

  /** Two drapes: a wide coarse one for context, a sharp one for the foreground.
   *  A single level either blurs the near ground or costs hundreds of tiles. */
  async loadImagery() {
    const S = this.S;
    if (!S.useImagery) {
      this.renderer.setImagery(null, 'A'); this.renderer.setImagery(null, 'B');
      this.invalidate(); return;
    }
    const plans = {
      fast:     [{ z: 11, r: 25000, slot: 'A' }],
      balanced: [{ z: 11, r: 35000, slot: 'A' }, { z: 14, r: 4000, slot: 'B' }],
      max:      [{ z: 12, r: 20000, slot: 'A' }, { z: 15, r: 2800, slot: 'B' }]
    }[S.quality] || [];
    const src = IMAGERY_SOURCES[S.imgSource] || IMAGERY_SOURCES.esri;
    this.ui.toast('Fetching imagery…', 9000);
    try {
      for (const step of plans) {
        const img = await buildImagery(src, S.lat, S.lon, step.r, step.z,
          (d, t) => this.ui.progress(d / t));
        this.renderer.setImagery(img, step.slot);
        this.invalidate();
      }
      this.ui.progress(0);
      const px = { fast: 53, balanced: 6.6, max: 3.4 }[S.quality];
      this.ui.toast(`Imagery draped · about ${px} m per pixel in the foreground`, 3000);
    } catch (e) { this.ui.toast('Imagery failed: ' + e.message, 4000); }
    this.invalidate();
  }

  async upgradeCatalog() {
    this.ui.toast('Downloading star catalogue…', 8000);
    const cat = await loadFullCatalog();
    if (!cat) { this.ui.toast('Could not reach the catalogue CDN. The built-in stars are still accurate.', 5000); return; }
    const merged = cat.concat(fillerStars(400, A.galToEq));
    this.starList = merged;
    this.renderer.setStars(merged, bvToRGB, A.raDecToVec);
    this.catalogNote = `Full catalogue loaded: ${cat.length} real stars to magnitude 6.5, cached on this device.`;
    this.ui.toast(`${cat.length} stars loaded`, 3000);
    this.invalidate();
  }

  /* ---------- location ---------- */
  setLocation(lat, lon, name) {
    const S = this.S;
    S.lat = Math.max(-85, Math.min(85, lat)); S.lon = ((lon + 540) % 360) - 180;
    S.name = name || `${S.lat.toFixed(4)}, ${S.lon.toFixed(4)}`;
    S.terrainLoaded = false; S.terrainInfo = '';
    this.mesh = null; this.dem = null;
    this.renderer.clearTerrain();
    this.renderer.setImagery(null);
    this.save();
    this.recomputeNight(); this.recompute();
    this.ui.refresh();
    if (S.autoTerrain) this.loadTerrain();
  }

  async geocode(q) {
    // coordinates typed directly
    const m = q.match(/(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)/);
    const out = [];
    if (m) out.push({ name: `${m[1]}, ${m[2]}`, lat: +m[1], lon: +m[2] });
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&q=${encodeURIComponent(q)}`,
        { headers: { 'Accept': 'application/json' } });
      if (r.ok) {
        const j = await r.json();
        for (const h of j) out.push({ name: h.display_name, lat: +h.lat, lon: +h.lon });
      }
    } catch (e) { /* offline: presets and coordinates still work */ }
    return out;
  }

  useGPS() {
    if (!navigator.geolocation) return this.ui.toast('No geolocation on this device');
    this.ui.toast('Getting a fix…');
    navigator.geolocation.getCurrentPosition(
      p => { this.setLocation(p.coords.latitude, p.coords.longitude, 'My location'); this.ui.toast('Located'); },
      e => this.ui.toast('Location denied: ' + e.message, 4000),
      { enableHighAccuracy: true, timeout: 12000 });
  }

  /* ---------- view helpers ---------- */
  lookAtCore() {
    this.view.az = this.coreAz;
    this.view.alt = Math.max(2, Math.min(70, this.coreAlt));
    this.invalidate();
  }
  jumpToBest() {
    const w = P.shootWindows(this.night, this.constraints());
    if (w.length) { this.setJD(w[0].peakJD); this.ui.toast('Jumped to the core’s peak in tonight’s window'); }
    else if (this.summary.duskAstro) { this.setJD(this.summary.duskAstro); this.ui.toast('No window tonight — jumped to astronomical dusk'); }
    else if (this.summary.duskNaut) { this.setJD(this.summary.duskNaut); this.ui.toast('No astronomical dark tonight — jumped to nautical dusk'); }
    this.ui.refresh();
  }

  async toggleOrientation() {
    if (this._orient) {
      window.removeEventListener('deviceorientation', this._orient);
      window.removeEventListener('deviceorientationabsolute', this._orient);
      this._orient = null;
      document.getElementById('btnAR').classList.remove('on');
      return;
    }
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
        const p = await DeviceOrientationEvent.requestPermission();
        if (p !== 'granted') return this.ui.toast('Compass permission denied');
      }
    } catch (e) { return this.ui.toast('Compass unavailable'); }
    this._orient = ev => {
      let heading = ev.webkitCompassHeading != null ? ev.webkitCompassHeading
        : (ev.absolute && ev.alpha != null ? 360 - ev.alpha : null);
      if (heading == null) return;
      const so = (screen.orientation && screen.orientation.angle) || 0;
      this.view.az = (heading + so + 360) % 360;
      this.view.alt = Math.max(-80, Math.min(85, (ev.beta || 0) - 90 + (so === 0 ? 0 : 0)));
      this.dirty = true;
    };
    window.addEventListener('deviceorientationabsolute', this._orient, true);
    window.addEventListener('deviceorientation', this._orient, true);
    document.getElementById('btnAR').classList.add('on');
    this.ui.toast('Compass mode on — point the device at the horizon');
  }

  invalidate() { this.dirty = true; }

  toggleAerial(on) {
    const want = on === undefined ? this.mode !== 'aerial' : (on ? 'aerial' : 'eye') === 'aerial';
    if (want && !this.mesh) return this.ui.toast('Load the terrain first — there is nothing to fly over yet');
    if (want) {
      this._eyeAlt = this.view.alt;
      this._eyeAz = this.view.az;
      this.orbit.az = this.view.az;
      this.orbit.cx = 0; this.orbit.cz = 0;
      this.orbit.dist = Math.max(2500, Math.min(20000, this.mesh.rMax * 0.05));
      this.orbit.pitch = 38;
      this.mode = 'aerial';
      this.ui.toast('Scout view — drag to orbit, pinch to zoom, tap the ground to pick a spot');
    } else {
      this.mode = 'eye';
      this.view.az = this.orbit.az;
      this.view.alt = this._eyeAlt === undefined ? 10 : this._eyeAlt;
      this.pick = null;
      this.renderer.setWorldLine('pickring', null);
      this.renderer.setWorldLine('pickpin', null);
    }
    document.getElementById('btnAerial').classList.toggle('on', this.mode === 'aerial');
    this.ui.refresh();
    this.dirty = true;
  }

  /** Screen tap -> a point on the terrain. */
  pickAt(clientX, clientY) {
    if (!this.mesh || !this.dem) return;
    const rect = document.getElementById('stage').getBoundingClientRect();
    const v = this.renderer.view;
    const ndcX = ((clientX - rect.left) / rect.width) * 2 - 1;
    const ndcY = 1 - ((clientY - rect.top) / rect.height) * 2;
    const d = [
      v.fwd[0] + v.right[0] * ndcX * v.tanX + v.up[0] * ndcY * v.tanY,
      v.fwd[1] + v.right[1] * ndcX * v.tanX + v.up[1] * ndcY * v.tanY,
      v.fwd[2] + v.right[2] * ndcX * v.tanX + v.up[2] * ndcY * v.tanY
    ];
    const L = Math.hypot(d[0], d[1], d[2]);
    const hit = raycastTerrain(this.mesh, this.dem, this.view.pos || [0, 0, 0],
      [d[0] / L, d[1] / L, d[2] / L], this.mesh.rMax);
    if (!hit) {
      this.pick = null;
      this.renderer.setWorldLine('pickring', null);
      this.renderer.setWorldLine('pickpin', null);
      this.dirty = true; return;
    }
    this.pick = hit;
    // ring plus a pin, sized against the camera distance so it reads at any zoom
    const cam = this.view.pos || [0, 0, 0];
    const camDist = Math.hypot(hit.x - cam[0], hit.y - cam[1], hit.z - cam[2]);
    const rad = Math.max(25, camDist * 0.022);
    const pts = [];
    for (let i = 0; i <= 56; i++) {
      const t = i / 56 * Math.PI * 2;
      const x = hit.x + Math.cos(t) * rad, z = hit.z + Math.sin(t) * rad;
      pts.push(x, groundYAt(this.mesh, this.dem, x, z) + 6, z);
    }
    this.renderer.setWorldLine('pickring', pts, { color: [1, 0.85, 0.35, 0.95], mode: 'LINE_STRIP' });
    this.renderer.setWorldLine('pickpin',
      [hit.x, hit.y + 4, hit.z, hit.x, hit.y + rad * 2.6, hit.z],
      { color: [1, 0.85, 0.35, 0.9], mode: 'LINE_STRIP' });
    this.ui.refresh();
    this.dirty = true;
  }

  /** Move the observer to the picked point, reusing the elevation pyramid. */
  async standHere() {
    if (!this.pick || !this.dem) return;
    const S = this.S, p = this.pick;
    const fine = this.dem.levels[0];
    const far = haversine(this.dem.lat, this.dem.lon, p.lat, p.lon);
    S.lat = p.lat; S.lon = p.lon;
    S.name = `${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}`;
    this.save();
    if (fine && far > fine.radius * 0.55) {
      this.ui.toast('Outside the detailed tiles — fetching this area…');
      this.pick = null;
      this.renderer.setWorldLine('pickring', null);
      this.renderer.setWorldLine('pickpin', null);
      await this.loadTerrain();
      this.toggleAerial(false);
      return;
    }
    const t0 = performance.now();
    const azSteps = { fast: 512, balanced: 768, max: 1024 }[S.quality];
    const mesh = buildMesh(this.dem, S.lat, S.lon, {
      azSteps, rMax: S.rMax, eyeHeight: S.eyeHeight,
      drMax: S.quality === 'max' ? 700 : 900
    });
    this.mesh = mesh;
    this.renderer.setTerrain(mesh);
    this.pick = null;
    this.renderer.setWorldLine('pickring', null);
    this.renderer.setWorldLine('pickpin', null);
    this.orbit.cx = 0; this.orbit.cz = 0;
    this.recomputeNight();
    this.recompute();
    this.ui.toast(`Standing at ${mesh.baseElev.toFixed(0)} m · rebuilt in ${Math.round(performance.now() - t0)} ms`);
    this.ui.refresh();
  }

  /** Ground bearings from the standing point: where the core is now, and the
   *  foreground direction you locked in. Only rebuilt when they actually move. */
  updateGroundLines() {
    if (!this.mesh || !this.dem) return;
    const S = this.S;
    const key = `${this.coreAz.toFixed(1)}|${S.targetAz}|${Math.round(this.mesh.baseElev)}`;
    if (key === this._glKey) return;
    this._glKey = key;
    const ray = (az, color, name) => {
      const pts = [], max = Math.min(this.mesh.rMax * 0.6, 40000);
      for (let d = 0; d <= max; d += Math.max(60, d * 0.02)) {
        const x = d * Math.sin(az * A.DEG), z = -d * Math.cos(az * A.DEG);
        pts.push(x, groundYAt(this.mesh, this.dem, x, z) + 10, z);
      }
      this.renderer.setWorldLine(name, pts, { color, mode: 'LINE_STRIP' });
    };
    ray(this.coreAz, [1, 0.55, 0.26, 0.9], 'coreray');
    if (S.targetAz != null) ray(S.targetAz, [0.37, 0.66, 1, 0.85], 'targetray');
    else this.renderer.setWorldLine('targetray', null);
  }

  /** Flatten the scene plus the overlay into a PNG the user can keep. */
  exportFrame() {
    if (window.__ASTROSCOUT_PREVIEW) {
      this.ui.toast('Saving frames is disabled in this hosted preview — it works in the deployed build.', 4000);
      return;
    }
    const gl = document.getElementById('gl'), hud = document.getElementById('hud');
    const c = document.createElement('canvas');
    c.width = gl.width; c.height = gl.height;
    const x = c.getContext('2d');
    x.drawImage(gl, 0, 0);
    x.drawImage(hud, 0, 0, c.width, c.height);
    const S = this.S, d = new Date(this.date.getTime() + S.tzMin * 60000);
    const stamp = `${S.name} · ${d.toUTCString().slice(0, 22)} · ${Math.round(S.focal)}mm · core ${this.coreAlt.toFixed(0)}° ${P.compass(this.coreAz)}`;
    x.font = `${Math.round(c.height / 52)}px system-ui, sans-serif`;
    x.fillStyle = 'rgba(0,0,0,.55)';
    const w = x.measureText(stamp).width + 24;
    x.fillRect(10, c.height - 46, w, 34);
    x.fillStyle = '#fff'; x.textBaseline = 'middle';
    x.fillText(stamp, 22, c.height - 29);
    c.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = `astroscout-${S.name.replace(/[^a-z0-9]+/gi, '-').toLowerCase()}-${d.toISOString().slice(0, 16).replace(/[:T]/g, '')}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }, 'image/png');
    this.ui.toast('Frame saved');
  }

  /* ---------- input ---------- */
  bindInput() {
    const stage = document.getElementById('stage');
    const pts = new Map();
    let lastDist = 0;
    stage.addEventListener('pointerdown', e => {
      if (e.target.closest('#dock,#sheet,#top')) return;
      pts.set(e.pointerId, e); stage.setPointerCapture(e.pointerId);
      this._moved = false; this._downAt = { x: e.clientX, y: e.clientY, t: performance.now() };
    });
    stage.addEventListener('pointermove', e => {
      if (!pts.has(e.pointerId)) return;
      const prev = pts.get(e.pointerId);
      pts.set(e.pointerId, e);
      const dx = e.clientX - prev.clientX, dy = e.clientY - prev.clientY;
      if (Math.abs(dx) + Math.abs(dy) > 3) this._moved = true;
      if (pts.size === 1 && this.mode === 'aerial') {
        this.orbit.az = ((this.orbit.az - dx * 0.35) % 360 + 360) % 360;
        this.orbit.pitch = Math.max(8, Math.min(88, this.orbit.pitch + dy * 0.25));
        this.dirty = true;
      } else if (pts.size === 1) {
        const degPerPx = this.view.vfovDeg / (this.renderer.h / this.dpr);
        this.view.az = ((this.view.az - dx * degPerPx) % 360 + 360) % 360;
        this.view.alt = Math.max(-85, Math.min(88, this.view.alt + dy * degPerPx));
        this.dirty = true;
      } else if (pts.size === 2) {
        const a = [...pts.values()];
        const d = Math.hypot(a[0].clientX - a[1].clientX, a[0].clientY - a[1].clientY);
        if (lastDist) this.zoom(d / lastDist);
        lastDist = d;
      }
    });
    const up = e => {
      if (!this._moved && this.mode === 'aerial' && this._downAt &&
          performance.now() - this._downAt.t < 600 && pts.has(e.pointerId)) {
        this.pickAt(e.clientX, e.clientY);
      }
      pts.delete(e.pointerId); if (pts.size < 2) lastDist = 0;
    };
    stage.addEventListener('pointerup', up);
    stage.addEventListener('pointercancel', up);
    stage.addEventListener('wheel', e => { e.preventDefault(); this.zoom(e.deltaY > 0 ? 0.92 : 1.087); }, { passive: false });
    window.addEventListener('keydown', e => {
      const k = e.key;
      if (k === 'ArrowLeft') this.view.az = (this.view.az - 2 + 360) % 360;
      else if (k === 'ArrowRight') this.view.az = (this.view.az + 2) % 360;
      else if (k === 'ArrowUp') this.view.alt = Math.min(88, this.view.alt + 2);
      else if (k === 'ArrowDown') this.view.alt = Math.max(-85, this.view.alt - 2);
      else if (k === '[') this.zoom(0.92);
      else if (k === ']') this.zoom(1.087);
      else if (k === ' ') { e.preventDefault(); this.togglePlay(); }
      else if (k === ',') this.setJD(this.jd - 1 / 144);
      else if (k === '.') this.setJD(this.jd + 1 / 144);
      else return;
      this.dirty = true;
    });
    window.addEventListener('resize', () => { this.dirty = true; });
  }
  zoom(f) {
    if (this.mode === 'aerial') {
      this.orbit.dist = Math.max(400, Math.min(this.mesh ? this.mesh.rMax * 0.75 : 90000, this.orbit.dist / f));
    } else {
      this.S.focal = Math.max(8, Math.min(400, this.S.focal * f));
    }
    this.dirty = true;
  }

  /* ---------- loop ---------- */
  loop() {
    const step = ts => {
      const dt = this._last ? (ts - this._last) / 1000 : 0;
      this._last = ts;
      if (this.playing && dt > 0) {
        this.date = new Date(this.date.getTime() + dt * this.S.speed * 1000);
        this.checkNight();
        this.recompute();
      }
      this.frame();
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  /** Orbit camera: eye sits behind the look-at point, above the ground. */
  aerialCamera() {
    const o = this.orbit;
    const gy = this.mesh && this.dem ? groundYAt(this.mesh, this.dem, o.cx, o.cz) : 0;
    const p = o.pitch * A.DEG, a = o.az * A.DEG;
    const fwd = [Math.cos(p) * Math.sin(a), -Math.sin(p), -Math.cos(p) * Math.cos(a)];
    const eye = [o.cx - fwd[0] * o.dist, gy - fwd[1] * o.dist, o.cz - fwd[2] * o.dist];
    if (this.mesh && this.dem) {
      const floor = groundYAt(this.mesh, this.dem, eye[0], eye[2]) + 120;
      if (eye[1] < floor) eye[1] = floor;
    }
    return { pos: eye, az: o.az, alt: -o.pitch, height: eye[1] - gy };
  }

  frame() {
    const S = this.S, r = this.renderer;
    const stage = document.getElementById('stage');
    r.resize(stage.clientWidth, stage.clientHeight, this.dpr);
    const e = P.exposureAdvice({ focal: S.focal, fNumber: S.fNumber, sensor: S.sensor, megapixels: S.mp });
    const lensV = S.portrait ? e.hfov : e.vfov;

    // ease between the eye-level lens view and the orbit view
    const want = this.mode === 'aerial' ? 1 : 0;
    if (this.blend !== want) {
      const d = 0.09 * (want ? 1 : -1);
      this.blend = Math.max(0, Math.min(1, this.blend + d));
      this.dirty = true;
    }
    const k = this.blend * this.blend * (3 - 2 * this.blend);
    const cam = this.aerialCamera();
    this.view.aerial = this.blend > 0.02;
    this.view.camHeight = cam.height;
    if (k > 0) {
      this.view.pos = [cam.pos[0] * k, cam.pos[1] * k, cam.pos[2] * k];
      this.view.az = this.mode === 'aerial' ? cam.az : this.view.az;
      this.view.alt = this._eyeAlt === undefined ? this.view.alt
        : this._eyeAlt * (1 - k) + cam.alt * k;
      this.view.vfovDeg = Math.max(1.2, Math.min(150, lensV * S.contextZoom)) * (1 - k) + 58 * k;
    } else {
      this.view.pos = [0, 0, 0];
      this.view.vfovDeg = Math.max(1.2, Math.min(150, lensV * S.contextZoom));
    }

    const hidden = new Set();
    if (!S.showFigures || this.skyBright > 0.8) hidden.add('figures');
    if (!S.showGrid) hidden.add('grid');
    if (!S.showGalactic) hidden.add('galactic');
    if (!S.showCorePath || this.view.aerial) hidden.add('corepath');
    if (this.view.aerial) { hidden.add('grid'); }
    if (!this.view.aerial) {
      hidden.add('pickring'); hidden.add('pickpin');
      hidden.add('coreray'); hidden.add('targetray');
    }

    r.draw(this.view, {
      skyMatrix: this.skyMatrixGL, galMatrix: this.galMatrix,
      sunDir: this.sunDir, moonDir: this.moonDir,
      sunAlt: this.sunAlt, moonAlt: this.moonAlt, moonIllum: this.ill.fraction,
      mwGain: S.mwGain, lightPol: S.lightPol, exposure: S.exposure,
      lpColor: [1.0, 0.72, 0.42], skyBright: this.skyBright,
      starGain: S.starGain, magLimit: S.magLimit,
      showStars: S.showStars, showTerrain: S.showTerrain,
      haze: S.haze, foregroundBoost: S.foregroundBoost,
      useImagery: S.useImagery,
      scoutLight: k * S.scoutLight,
      snowLine: this.snowLine || 2600, treeLine: this.treeLine || 1800,
      hiddenLines: hidden
    }, this.bodies);
    if (this.view.aerial) this.updateGroundLines();

    this.ui.drawHUD();
    this.ui.drawTimeline();
    this.updateChips();
    this.dirty = false;
  }

  updateChips() {
    const S = this.S, sum = this.summary;
    const F = j => P.fmtTime(j, S.tzMin);
    const d = new Date(this.date.getTime() + S.tzMin * 60000);
    document.getElementById('clock').textContent =
      `${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')}`;
    document.getElementById('cdate').textContent =
      d.toUTCString().slice(0, 16) + ` · UTC${S.tzMin >= 0 ? '+' : ''}${(S.tzMin / 60).toFixed(1).replace('.0', '')}`;
    document.getElementById('placeName').textContent = S.name;
    document.getElementById('placeSub').textContent =
      `${S.lat.toFixed(4)}, ${S.lon.toFixed(4)}` + (this.mesh ? ` · ${this.mesh.baseElev.toFixed(0)} m` : ' · no terrain');

    const chips = [];
    const clear = this.mesh ? horizonAltAt(this.mesh, this.coreAz) : 0;
    const above = this.coreAlt > clear;
    chips.push(`<div class="chip core">CORE <b>${this.coreAlt.toFixed(0)}° ${P.compass(this.coreAz)}</b>${this.mesh ? ` · skyline ${clear.toFixed(0)}°` : ''}</div>`);
    chips.push(`<div class="chip ${this.sunAlt < -18 ? 'good' : this.sunAlt < -12 ? '' : 'warn'}">sun <b>${this.sunAlt.toFixed(0)}°</b> ${this.sunAlt < -18 ? 'astro dark' : this.sunAlt < -12 ? 'nautical' : this.sunAlt < -6 ? 'civil' : this.sunAlt < 0 ? 'twilight' : 'day'}</div>`);
    chips.push(`<div class="chip moon">moon <b>${(this.ill.fraction * 100).toFixed(0)}%</b> ${this.moonAlt > 0 ? `up ${this.moonAlt.toFixed(0)}°` : 'down'}</div>`);
    const e = P.exposureAdvice({ focal: S.focal, fNumber: S.fNumber, sensor: S.sensor, megapixels: S.mp, decl: this.coreDec });
    chips.push(`<div class="chip">${Math.round(S.focal)}mm f/${S.fNumber.toFixed(1)} · <b>${e.npf.toFixed(0)}s</b> · ISO ${e.suggestedISO}</div>`);
    if (!sum.hasAstroDark) chips.push(`<div class="chip warn">no astro dark tonight <b>(${sum.darkestSunAlt.toFixed(0)}°)</b></div>`);
    document.getElementById('chips').innerHTML = chips.join('');
  }
}

/* helpers */
function glMat3(m) { return new Float32Array([m[0], m[3], m[6], m[1], m[4], m[7], m[2], m[5], m[8]]); }
function transpose3(m) { return [m[0], m[3], m[6], m[1], m[4], m[7], m[2], m[5], m[8]]; }
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const normalize = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
function smoothstep(a, b, x) { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

UI.prototype.refresh = function () {
  if (this.sheet.classList.contains('open')) this.renderSheet();
  this.app.invalidate();
};

const app = new App();
window.app = app;
app.init();

return {};
})();

})();
