<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>AstroScout — Milky Way shot planner</title>
<meta name="description" content="Stand anywhere on Earth and see the real terrain against an astronomically accurate sky. Plan Milky Way compositions over mountains.">
<meta name="theme-color" content="#07080c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AstroScout">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="prog"></div>

<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="hud"></canvas>

  <div id="top">
    <div class="place">
      <b id="placeName">—</b>
      <span id="placeSub">—</span>
    </div>
    <button class="iconbtn" id="btnAerial" title="Scout from the air">⛰</button>
    <button class="iconbtn" id="btnNorth" title="Point at the galactic core">✥</button>
    <button class="iconbtn" id="btnAR" title="Use the device compass">◎</button>
    <button class="iconbtn" id="btnDark" title="Jump to the best moment tonight">★</button>
  </div>

  <div id="chips"></div>

  <div id="dock">
    <canvas id="timeline"></canvas>
    <div id="timerow">
      <div>
        <div class="now" id="clock">--:--</div>
        <div class="date" id="cdate">—</div>
      </div>
      <div class="grow"></div>
      <button class="iconbtn" id="btnNow" title="Now">⟲</button>
      <button class="iconbtn" id="btnPlay" title="Animate time">▶</button>
    </div>
    <div class="tabbar">
      <div class="tab" data-tab="where">Where</div>
      <div class="tab" data-tab="when">When</div>
      <div class="tab" data-tab="camera">Camera</div>
      <div class="tab" data-tab="plan">Plan</div>
      <div class="tab" data-tab="sky">Sky</div>
      <div class="tab" data-tab="about">About</div>
    </div>
  </div>

  <div id="sheet">
    <div class="grabber"></div>
    <header>
      <h2 id="sheetTitle"></h2>
      <button class="iconbtn" id="sheetClose">✕</button>
    </header>
    <div class="body" id="sheetBody"></div>
  </div>

  <div id="scoutbar" hidden>
    <div class="info">
      <b id="scoutTitle">Tap the ground to pick a spot</b>
      <span id="scoutSub">Drag to orbit · pinch to zoom</span>
    </div>
    <button class="btn" id="scoutStand" disabled>Stand here</button>
    <button class="btn" id="scoutBack">Eye level</button>
  </div>

  <div id="toast"></div>
</div>

<div id="splash">
  <div>
    <div class="t">AstroScout</div>
    <div class="s">Real terrain. Real sky. Loading…</div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
